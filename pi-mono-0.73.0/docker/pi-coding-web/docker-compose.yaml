services:
  postgres:
    image: ${PI_POSTGRES_IMAGE:-postgres:16-alpine}
    pull_policy: ${PI_POSTGRES_PULL_POLICY:-never}
    container_name: pi-coding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PI_POSTGRES_DB:-pi_coding}
      POSTGRES_USER: ${PI_POSTGRES_USER:-pi}
      POSTGRES_PASSWORD: ${PI_POSTGRES_PASSWORD:-pi}
    volumes:
      - pi-postgres-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${PI_REDIS_IMAGE:-redis:7-alpine}
    pull_policy: ${PI_REDIS_PULL_POLICY:-never}
    container_name: pi-coding-redis
    restart: unless-stopped
    volumes:
      - pi-redis-data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  pi-coding-web:
    image: ${PI_CODING_WEB_IMAGE:-pi-coding-web:0.73.0}
    pull_policy: ${PI_CODING_WEB_PULL_POLICY:-never}
    container_name: pi-coding-web
    init: true
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      PI_REDIS_URL: redis://redis:6379
      PI_RUNTIME_STORE: ${PI_RUNTIME_STORE:-postgres}
      PI_POSTGRES_URL: "${PI_POSTGRES_URL:-postgres://pi:pi@postgres:5432/pi_coding}"
      PI_MODEL_STREAM_IDLE_TIMEOUT_MS: ${PI_MODEL_STREAM_IDLE_TIMEOUT_MS:-120000}
    ports:
      - "${PI_CODING_WEB_HOST_BIND:-0.0.0.0}:${PI_CODING_WEB_PORT:-5173}:5173"
    volumes:
      - ./data/app:/app/apps/pi-coding-web/data:z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173/api/pi-storage/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  pi-worker:
    image: ${PI_CODING_WEB_IMAGE:-pi-coding-web:0.73.0}
    pull_policy: ${PI_CODING_WEB_PULL_POLICY:-never}
    container_name: pi-worker
    init: true
    restart: unless-stopped
    command: ["node", "dist-worker/worker/main.js"]
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      PI_REDIS_URL: redis://redis:6379
      PI_RUNTIME_STORE: ${PI_RUNTIME_STORE:-postgres}
      PI_POSTGRES_URL: "${PI_POSTGRES_URL:-postgres://pi:pi@postgres:5432/pi_coding}"
      PI_MODEL_STREAM_IDLE_TIMEOUT_MS: ${PI_MODEL_STREAM_IDLE_TIMEOUT_MS:-120000}
      PI_WORKER_ID: ${PI_WORKER_ID:-pi-worker}
    volumes:
      - ./data/app:/app/apps/pi-coding-web/data:z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pi-cutover-rehearsal:
    image: ${PI_CODING_WEB_IMAGE:-pi-coding-web:0.73.0}
    pull_policy: ${PI_CODING_WEB_PULL_POLICY:-never}
    init: true
    profiles: ["cutover"]
    command: ["node", "dist-worker/worker/cutover-rehearsal.js"]
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: production
      PI_REDIS_URL: redis://redis:6379
      PI_RUNTIME_STORE: ${PI_RUNTIME_STORE:-postgres}
      PI_POSTGRES_URL: "${PI_POSTGRES_URL:-postgres://pi:pi@postgres:5432/pi_coding}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pi-coding-web:
        condition: service_healthy

volumes:
  pi-postgres-data:
  pi-redis-data:
