
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>功能测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .pass { background-color: #d4edda; }
        .fail { background-color: #f8d7da; }
    </style>
</head>
<body>
    <h1>个人备忘录日历 - 功能测试</h1>
    <div id="tests"></div>
    
    <script>
        const tests = [
            {
                name: '日历排列测试（周一开头）',
                test: () => {
                    const today = new Date();
                    const year = today.getFullYear();
                    const month = today.getMonth() + 1;
                    const firstDay = new Date(year, month - 1, 1).getDay();
                    return firstDay === 1; // 周一
                }
            },
            {
                name: '闰年测试（2024年2月有29天）',
                test: () => {
                    const days = new Date(2024, 2, 0).getDate();
                    return days === 29;
                }
            },
            {
                name: '年份范围测试（±10年）',
                test: () => {
                    const currentYear = new Date().getFullYear();
                    const start = currentYear - 10;
                    const end = currentYear + 10;
                    return end - start === 20;
                }
            },
            {
                name: '日期格式测试（YYYY-MM-DD）',
                test: () => {
                    const d = new Date(2024, 0, 5);
                    const str = d.getFullYear() + '-' + 
                               String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                               String(d.getDate()).padStart(2, '0');
                    return str === '2024-01-05';
                }
            }
        ];
        
        const container = document.getElementById('tests');
        tests.forEach(t => {
            const div = document.createElement('div');
            div.className = 'test ' + (t.test() ? 'pass' : 'fail');
            div.innerHTML = '<strong>' + t.name + '</strong>: ' + (t.test() ? '✅ 通过' : '❌ 失败');
            container.appendChild(div);
        });
    </script>
</body>
</html>
