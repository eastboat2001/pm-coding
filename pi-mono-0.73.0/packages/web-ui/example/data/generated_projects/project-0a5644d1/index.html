<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人备忘录日历</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <h1>📅 个人备忘录日历</h1>
            <div class="controls">
                <div class="select-group">
                    <label for="yearSelect">年份：</label>
                    <select id="yearSelect" class="select"></select>
                </div>
                <div class="select-group">
                    <label for="monthSelect">月份：</label>
                    <select id="monthSelect" class="select">
                        <option value="1">1月</option>
                        <option value="2">2月</option>
                        <option value="3">3月</option>
                        <option value="4">4月</option>
                        <option value="5">5月</option>
                        <option value="6">6月</option>
                        <option value="7">7月</option>
                        <option value="8">8月</option>
                        <option value="9">9月</option>
                        <option value="10">10月</option>
                        <option value="11">11月</option>
                        <option value="12">12月</option>
                    </select>
                </div>
                <button id="todayBtn" class="btn btn-today">📅 回到今天</button>
            </div>
        </header>

        <!-- 日历主体 -->
        <main class="calendar">
            <!-- 星期表头 -->
            <div class="weekday-header">
                <div class="weekday">周一</div>
                <div class="weekday">周二</div>
                <div class="weekday">周三</div>
                <div class="weekday">周四</div>
                <div class="weekday">周五</div>
                <div class="weekday">周六</div>
                <div class="weekday">周日</div>
            </div>
            <!-- 日期格子区域 -->
            <div id="calendarGrid" class="calendar-grid"></div>
        </main>

        <!-- 备忘录编辑弹窗 -->
        <div id="memoModal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">备忘录 - 2024-01-01</h2>
                    <button id="closeModal" class="btn-close">&times;</button>
                </div>
                <div class="modal-body">
                    <textarea id="memoText" class="textarea" placeholder="请在此输入备忘录内容..."></textarea>
                </div>
                <div class="modal-footer">
                    <button id="saveMemo" class="btn btn-save">💾 保存</button>
                    <button id="deleteMemo" class="btn btn-delete">🗑️ 删除</button>
                </div>
            </div>
        </div>

        <!-- 存储状态提示 -->
        <div id="storageWarning" class="storage-warning hidden">
            ⚠️ 本地存储不可用，数据将无法持久化
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
