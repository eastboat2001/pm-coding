services:
  postgres:
    image: ${PI_POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine}
    pull_policy: ${PI_POSTGRES_PULL_POLICY:-never}
    container_name: pi-coding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PI_POSTGRES_DB:-pi_coding}
      POSTGRES_USER: ${PI_POSTGRES_USER:-pi}
      POSTGRES_PASSWORD: ${PI_POSTGRES_PASSWORD:-pi}
    volumes:
      - pi-postgres-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${PI_REDIS_IMAGE:-docker.io/library/redis:7-alpine}
    pull_policy: ${PI_REDIS_PULL_POLICY:-never}
    container_name: pi-coding-redis
    restart: unless-stopped
    volumes:
      - pi-redis-data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  pi-coding-web:
    image: ${PI_CODING_WEB_IMAGE:-pi-coding-web:0.73.0-intranet-20260721-r1}
    pull_policy: ${PI_CODING_WEB_PULL_POLICY:-never}
    container_name: pi-coding-web
    init: true
    restart: unless-stopped
    env_file: ${PI_COMPOSE_ENV_FILE:-./.env}
    environment:
      NODE_ENV: production
      PI_REDIS_URL: redis://redis:6379
      PI_RUNTIME_STORE: ${PI_RUNTIME_STORE:-postgres}
      PI_POSTGRES_URL: "${PI_POSTGRES_URL:-postgres://pi:pi@postgres:5432/pi_coding}"
      PI_PREVIEW_BASE_URL: ${PI_PREVIEW_BASE_URL:?Set PI_PREVIEW_BASE_URL to the browser-accessible intranet origin}
      PI_PREVIEW_INTERNAL_ORIGIN: http://pi-coding-web:5173
      PI_MODEL_STREAM_IDLE_TIMEOUT_MS: ${PI_MODEL_STREAM_IDLE_TIMEOUT_MS:-120000}
    ports:
      - "${PI_CODING_WEB_HOST_BIND:-0.0.0.0}:${PI_CODING_WEB_PORT:-5173}:5173"
    volumes:
      - ./data/app:/app/apps/pi-coding-web/data:z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173/api/pi-storage/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  pi-worker:
    image: ${PI_CODING_WEB_IMAGE:-pi-coding-web:0.73.0-intranet-20260721-r1}
    pull_policy: ${PI_CODING_WEB_PULL_POLICY:-never}
    container_name: pi-worker
    init: true
    restart: unless-stopped
    command: ["node", "dist-worker/worker/main.js"]
    env_file: ${PI_COMPOSE_ENV_FILE:-./.env}
    environment:
      NODE_ENV: production
      PI_REDIS_URL: redis://redis:6379
      PI_RUNTIME_STORE: ${PI_RUNTIME_STORE:-postgres}
      PI_POSTGRES_URL: "${PI_POSTGRES_URL:-postgres://pi:pi@postgres:5432/pi_coding}"
      PI_PREVIEW_BASE_URL: ${PI_PREVIEW_BASE_URL:?Set PI_PREVIEW_BASE_URL to the browser-accessible intranet origin}
      PI_PREVIEW_INTERNAL_ORIGIN: http://pi-coding-web:5173
      PI_MODEL_STREAM_IDLE_TIMEOUT_MS: ${PI_MODEL_STREAM_IDLE_TIMEOUT_MS:-120000}
      PI_WORKER_ID: ${PI_WORKER_ID:-pi-worker}
      PI_BUILD_CONTAINER_ENGINE: ${PI_BUILD_CONTAINER_ENGINE:-podman}
      PI_BUILD_CONTAINER_IMAGE: ${PI_BUILD_CONTAINER_IMAGE:-docker.io/library/node@sha256:e21fc383b50d5347dc7a9f1cae45b8f4e2f0d39f7ade28e4eef7d2934522b752}
      PI_BUILD_PROXY_IMAGE: ${PI_BUILD_PROXY_IMAGE:-docker.io/ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029}
      PI_BUILD_TIMEOUT_MS: ${PI_BUILD_TIMEOUT_MS:-300000}
      PI_BUILD_CPUS: ${PI_BUILD_CPUS:-1}
      PI_BUILD_MEMORY_MB: ${PI_BUILD_MEMORY_MB:-1024}
      PI_BUILD_PIDS_LIMIT: ${PI_BUILD_PIDS_LIMIT:-128}
      PI_BUILD_MAX_LOG_CHARS: ${PI_BUILD_MAX_LOG_CHARS:-12000}
      PI_BUILD_REGISTRY_ORIGINS: ${PI_BUILD_REGISTRY_ORIGINS:-https://registry.npmjs.org}
      CONTAINER_HOST: unix:///run/podman/podman.sock
    security_opt:
      - label=disable
    volumes:
      - ./data/app:/app/apps/pi-coding-web/data:z
      - type: bind
        source: ${XDG_RUNTIME_DIR:?XDG_RUNTIME_DIR must be set for rootless Podman}/podman/podman.sock
        target: /run/podman/podman.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pi-coding-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "podman info >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  pi-postgres-data:
  pi-redis-data:
